name: Release pubbliche degli add-on

# Per ogni voce di site/addons.yml senza Release pubblica: scarica il pacchetto dalla Release dell'add-on,
# verifica che sia identico a quello di addons.yml e crea la Release "tag_pubblico" (tag compreso).
# Parte quando su main cambia site/addons.yml, oppure a mano da Actions ("Run workflow").
on:
  push:
    branches: [main]
    paths: ["site/addons.yml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Crea le Release mancanti
        env:
          GH_TOKEN: ${{ github.token }}
          # token in sola lettura sui repository degli add-on (Contents: read)
          XEI_ADDON_READ_TOKEN: ${{ secrets.XEI_ADDON_READ_TOKEN }}
        run: |
          for tag in $(python -m strumenti.copia_release elenco); do
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag: Release già presente"
              continue
            fi
            GH_TOKEN="$XEI_ADDON_READ_TOKEN" python -m strumenti.copia_release prepara --tag-pubblico "$tag" --out "pacchetti/$tag"
            titolo=$(python -c "from strumenti.copia_release import cerca_voce as c; v=c('$tag'); print(v['pacchetto'], v['versione'])")
            impronta=$(python -c "from strumenti.copia_release import cerca_voce as c; print(c('$tag')['sha256'])")
            gh release create "$tag" pacchetti/"$tag"/*.zip --target "$GITHUB_SHA" --title "$titolo" \
              --notes "$titolo. SHA-256: $impronta. Prova gratuita di 30 giorni: https://store.xeisrl.com/"
            echo "$tag: Release creata"
          done
