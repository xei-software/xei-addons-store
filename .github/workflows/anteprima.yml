name: Anteprima interna (Azure Static Web Apps)

# Il ramo «anteprima» è lo specchio di quello che andrà in produzione: ogni push lo pubblica nell'anteprima interna,
# visibile solo agli utenti GitHub invitati con il ruolo «interno». Dopo il controllo si unisce su main (sito pubblico).
# Istruzioni: docs/anteprima.md.
on:
  push:
    branches: [anteprima]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anteprima
  cancel-in-progress: true

jobs:
  anteprima:
    runs-on: ubuntu-latest
    env:
      TOKEN_ANTEPRIMA: ${{ secrets.AZURE_ANTEPRIMA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python build.py --anteprima --out _anteprima
      - name: Segreto mancante
        if: env.TOKEN_ANTEPRIMA == ''
        run: echo "::notice::Manca il segreto AZURE_ANTEPRIMA_TOKEN (docs/anteprima.md): anteprima generata ma non pubblicata."
      - name: Pubblica su Azure Static Web Apps
        if: env.TOKEN_ANTEPRIMA != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_ANTEPRIMA_TOKEN }}
          action: upload
          app_location: _anteprima
          skip_app_build: true
          skip_api_build: true
