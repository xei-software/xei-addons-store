condizioni_sintesi: 'Yazılım hatalar içerebilir ve arızalara, veri kaybına veya başka zararlara yol açabilir: önce verilerin bir kopyasıyla bir test ortamında denenmelidir. Yasanın izin verdiği ölçüde XEI S.r.l., kullanımından doğan zararlardan sorumlu değildir.'
condizioni_leggi: Kullanım koşullarının tamamını okuyun
condizioni_accetto: Kullanım koşullarını okudum ve kabul ediyorum; yazılımı gerçek verilerle kullanmadan önce bir test ortamında deneyeceğimi onaylıyorum.
condizioni_approvo: İtalyan Medeni Kanunu'nun 1341 ve 1342. maddeleri uyarınca, kullanım koşullarının 4. (yazılımın olduğu gibi sağlanması ve test ortamında deneme), 5. (sorumluluğun sınırlandırılması), 6. (tazmin) ve 8. (yetkili mahkeme) maddelerini özellikle onaylıyorum.
condizioni_nota: 'Açılan formda kabulünüzü e-posta adresinizle onaylarsınız: seçiminiz kaydedilir ve koşulların PDF kopyası size e-postayla gönderilir.'
