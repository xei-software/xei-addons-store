condizioni_sintesi: 'Die Software kann Fehler enthalten und Fehlfunktionen, Datenverluste oder andere Schäden verursachen: Sie muss zuerst in einer Testumgebung mit einer Kopie der Daten getestet werden. Soweit gesetzlich zulässig, haftet die XEI S.r.l. nicht für Schäden aus ihrer Nutzung.'
condizioni_leggi: Vollständige Nutzungsbedingungen lesen
condizioni_accetto: Ich habe die Nutzungsbedingungen gelesen und akzeptiere sie und bestätige, dass ich die Software in einer Testumgebung teste, bevor ich sie mit echten Daten verwende.
condizioni_approvo: Gemäß Artikel 1341 und 1342 des italienischen Zivilgesetzbuchs genehmige ich ausdrücklich die Artikel 4 (Software ohne Gewähr und Test in einer Testumgebung), 5 (Haftungsbeschränkung), 6 (Freistellung) und 8 (Gerichtsstand) der Nutzungsbedingungen.
condizioni_nota: 'Im sich öffnenden Formular bestätigen Sie die Annahme mit Ihrer E-Mail-Adresse: Ihre Wahl wird gespeichert und Sie erhalten per E-Mail eine PDF-Kopie der Bedingungen.'
