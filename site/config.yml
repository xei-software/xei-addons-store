# Configurazione generale del sito delle soluzioni software XEI.
nome_sito: XEI Store
azienda: XEI S.r.l.
repository: xei-software/xei-addons-store
# Dominio personalizzato di GitHub Pages (file CNAME del sito).
dominio: store.xeisrl.com
lingue: [it, en, fr, de, tr, es]
lingua_predefinita: it
# Casella che riceve le registrazioni e invia i codici di prova.
email_licenze: license@xeisrl.com
# Indirizzo del modulo Microsoft Forms per la registrazione: il link precompilato di Forms («Ottieni collegamento
# precompilato») con {addon} al posto della scelta della domanda «Add-on» e {lingua} al posto di quella della domanda
# «Lingua per le email». Finché è vuoto, il pulsante "Scarica gratis" apre un'email a email_licenze.
# Se il link contiene anche {richiesta} (scelta della domanda «Richiesta»), il modulo serve a entrambi i pulsanti: diventa
# richiesta_prova o richiesta_acquisto. Senza {richiesta}, "Acquista" apre un'email di acquisto a email_licenze.
modulo_registrazione: "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=1WKlnxbyhEyiikXvNwFHyezp6as0dY9Gj3NaVsFyg_lURVU5TjBBWUszVlpSWUJQMEQ4WFFGVDk1NS4u&rd727d2389c344ae1a77c99049f6c745c=%22{addon}%22&r51bc4dc5e72c41798cb4c306594ee910=%22{lingua}%22"
giorni_prova: 30
# Scelte della domanda «Richiesta» del modulo, identiche a quelle di Forms.
richiesta_prova: Prova gratuita
richiesta_acquisto: Acquisto
